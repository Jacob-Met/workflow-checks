name: utility-review-report-browser
on:
  pull_request:
    paths:
      - 'utility_watch/**'
      - '.github/workflows/utility-review-report-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real Chrome report receiving
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: node utility_watch/tests/review_report_browser.cjs "$RUNNER_TEMP/utility-review-report-browser"
      - name: Retain exact receiving evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: utility-review-report-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/utility-review-report-browser
          if-no-files-found: error
          retention-days: 14
