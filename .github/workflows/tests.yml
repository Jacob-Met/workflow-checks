name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: freight_packets
        working-directory: freight_packets
        run: python -m pytest -q
      - name: pt_auth
        working-directory: pt_auth
        run: python -m pytest -q
      - name: utility_watch
        working-directory: utility_watch
        run: python -m pytest -q
      - name: sample-site recovery
        run: python scripts/test_build_pages.py -v